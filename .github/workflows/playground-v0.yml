name: playground-v0

on:
  push:
    branches:
      - research/playground-v0
  workflow_dispatch:

jobs:
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run lifecycle, playground, effect-IR, sketch, surface, audition, and source tests
        run: >-
          python -m pytest -q
          tests_python/test_lifecycle_spike.py
          tests_python/test_playground_v0.py
          tests_python/test_playground_v1.py
          tests_python/test_playground_sources.py
          tests_python/test_effect_ir_v0.py
          tests_python/test_effect_ir_v1.py
          tests_python/test_effect_sketch_v0.py
          tests_python/test_effect_surface_v0.py
          tests_python/test_effect_audition_v0.py
      - name: Render recognisable-audio T4 authoring workflow demo
        run: >-
          python tools/render_t4_authoring_demo.py
          "test Project/Samples/Processed/Bounce/Bounce 1-E-Piano Basic [2026-05-06 064550]-1.wav"
          /tmp/effect-authoring-t4-demo
      - name: List T4 demo outputs
        run: find /tmp/effect-authoring-t4-demo -type f -printf '%P %s bytes\n' | sort
      - name: Upload T4 authoring demo
        uses: actions/upload-artifact@v4
        with:
          name: effect-authoring-t4-demo
          path: /tmp/effect-authoring-t4-demo
          if-no-files-found: error
      - name: Render playground v0 studies
        run: python tools/render_playground_studies.py --out /tmp/playground-renders/v0
      - name: Render playground v1 studies
        run: python tools/render_playground_v1.py --out /tmp/playground-renders/v1
      - name: List historical playground outputs
        run: find /tmp/playground-renders -type f -printf '%P %s bytes\n' | sort
      - name: Upload historical playground renders
        uses: actions/upload-artifact@v4
        with:
          name: playground-listening-renders
          path: /tmp/playground-renders
          if-no-files-found: error
